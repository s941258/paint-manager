<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漆料庫存管理</title>


<style>
:root{--bg:#fff;--bg2:#f5f5f3;--bg3:#eeede9;--text:#1a1a18;--text2:#6b6b67;--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.2);--r:8px;--rl:12px;--ibg:#e6f1fb;--itx:#0c447c;--okbg:#eaf3de;--oktx:#3b6d11;--wbg:#faeeda;--wtx:#854f0b;--dbg:#fcebeb;--dtx:#a32d2d}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2c;--text:#f0ede8;--text2:#8a8a86;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--ibg:#042c53;--itx:#85b7eb;--okbg:#173404;--oktx:#97c459;--wbg:#412402;--wtx:#ef9f27;--dbg:#501313;--dtx:#f09595}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
.wrap{max-width:1020px;margin:0 auto;padding:1.25rem 1rem}
header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:19px;font-weight:600;flex:1;display:flex;align-items:center;gap:7px}
.ctrls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
input[type=text],select{height:34px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);padding:0 9px;font-size:13px;outline:none}
input[type=text]:focus,select:focus{border-color:var(--text2)}
.sw{position:relative}.sw input{padding-left:28px}.sw .ti{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text2);pointer-events:none}
.btn{height:34px;padding:0 12px;border-radius:var(--r);border:.5px solid var(--border2);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;background:var(--bg);color:var(--text);transition:background .15s;text-decoration:none}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--text);color:var(--bg);border-color:transparent}
.btn-p:hover{opacity:.85;background:var(--text)}
.sync-bar{display:flex;align-items:center;gap:8px;padding:.45rem .85rem;background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);margin-bottom:1rem;font-size:12px;color:var(--text2)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .3s}
.sdot.ok{background:#5dcaa5}.sdot.spin{background:#ef9f27;animation:pulse 1s ease-in-out infinite}.sdot.err{background:var(--dtx)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.1rem}
.stat{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:.6rem .9rem}
.sl{font-size:11px;color:var(--text2);margin-bottom:2px}.sv{font-size:21px;font-weight:600}
.sv.w{color:var(--wtx)}.sv.d{color:var(--dtx)}
.tabs{display:flex;gap:2px;border-bottom:.5px solid var(--border);margin-bottom:.9rem}
.tab{padding:7px 14px;font-size:13px;border:none;background:none;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:5px}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.panel{display:none}.panel.on{display:block}
.card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{background:var(--bg2);padding:8px 9px;text-align:left;font-weight:500;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)}
td{padding:8px 9px;border-bottom:.5px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.dot{width:18px;height:18px;border-radius:4px;border:.5px solid var(--border2);display:inline-block;vertical-align:middle}
.badge{display:inline-block;padding:2px 6px;border-radius:var(--r);font-size:11px;font-weight:500}
.b9{background:#e2f5d8;color:#3b6d11}.bv{background:#dbeeff;color:#0c447c}.bot{background:var(--wbg);color:var(--wtx)}
.btype{background:var(--ibg);color:var(--itx)}
.bok{background:var(--okbg);color:var(--oktx)}.blow{background:var(--wbg);color:var(--wtx)}.bempty{background:var(--dbg);color:var(--dtx)}
.abtn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:14px;padding:3px;border-radius:4px}
.abtn:hover{color:var(--text);background:var(--bg2)}.delbtn:hover{color:var(--dtx)}
.empty{text-align:center;padding:2.5rem;color:var(--text2);font-size:13px}
.empty .ti{font-size:30px;display:block;margin-bottom:8px}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--bg);border-radius:var(--rl);border:.5px solid var(--border2);padding:1.25rem;width:360px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:15px;font-weight:600;margin-bottom:.9rem}
.fi{margin-bottom:10px}.fi label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px}
.fi input,.fi select{width:100%}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mact{display:flex;gap:8px;margin-top:1rem;justify-content:flex-end}
/* AI */






.ai-input-row input{flex:1;font-size:13px}

/* toast */
.toast{position:fixed;bottom:1.25rem;right:1.25rem;background:var(--text);color:var(--bg);padding:.55rem .9rem;border-radius:var(--r);font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.c0{width:32px}.c1{width:20%}.c2{width:11%}.c3{width:10%}.c4{width:9%}.c5{width:7%}.c6{width:8%}.c7{width:9%}.c8{width:10%;text-align:right}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.c3,.c4{display:none}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="login-screen" style="position:fixed;inset:0;background:#f5f5f3;display:flex;align-items:center;justify-content:center;z-index:9999">
  <div style="background:#fff;border:0.5px solid rgba(0,0,0,.15);border-radius:14px;padding:2.5rem 2rem;width:300px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <div style="font-size:40px;margin-bottom:12px">🎨</div>
    <div style="font-size:16px;font-weight:600;margin-bottom:4px;color:#1a1a18">漆料庫存管理</div>
    <div style="font-size:12px;color:#6b6b67;margin-bottom:20px">請輸入密碼進入系統</div>
    <input id="pwd" type="password" placeholder="密碼" maxlength="30"
      style="width:100%;height:42px;border:0.5px solid rgba(0,0,0,.2);border-radius:8px;padding:0 14px;font-size:15px;text-align:center;letter-spacing:3px;outline:none;margin-bottom:10px;background:#fff;color:#1a1a18">
    <button onclick="doLogin()"
      style="width:100%;height:42px;background:#1a1a18;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit">
      進入
    </button>
    <div id="login-err" style="font-size:12px;color:#a32d2d;margin-top:8px;min-height:16px"></div>
  </div>
</div>
<div class="wrap" id="main-wrap" style="display:none">
<header>
  <h1>🎨漆料庫存管理</h1>
  <div class="ctrls">
    <div class="sw">🔍<input type="text" id="q" placeholder="名稱、色號..."></div>
    <select id="fb"><option value="">全部品牌</option><option>九五二漆</option><option>Vallejo</option></select>
    <select id="ft"><option value="">全部類型</option><option>基本色</option><option>底漆</option><option>金屬漆</option><option>透明漆</option><option>陰影</option><option>特效</option></select>
    <select id="ftag"><option value="">噴塗+筆塗</option><option>噴塗</option><option>筆塗</option></select>
    <select id="fstock"><option value="">全部庫存</option><option value="in">有庫存</option><option value="out">已用完</option></select>
    <button class="btn btn-p" onclick="openAdd()">+新增</button>
    <button class="btn" id="refresh-btn" onclick="fetchSheets()" title="重新讀取">↻</button>
    <button class="btn" onclick="exportCSV()">↓CSV</button>
    <button class="btn" onclick="doLogout()" title="登出" style="color:var(--dtx)">⎋</button>
  </div>
</header>

<div class="sync-bar">
  <div class="sdot" id="sdot"></div>
  <span id="smsg">正在讀取資料...</span>
  <span style="flex:1"></span>
  <a href="https://docs.google.com/spreadsheets/d/1aFWuIyYVYrD8HIhiZPka_uUqodmldx5QSeCHBBn4y-w/edit" target="_blank" style="color:var(--itx);font-size:12px;text-decoration:none;display:flex;align-items:center;gap:3px">⊞在 Sheets 編輯</a>
</div>

<div class="stats">
  <div class="stat"><div class="sl">總漆料數</div><div class="sv" id="s0">—</div></div>
  <div class="stat"><div class="sl">有庫存</div><div class="sv" id="s1">—</div></div>
  <div class="stat"><div class="sl">庫存不足</div><div class="sv w" id="s2">—</div></div>
  <div class="stat"><div class="sl">已用完</div><div class="sv d" id="s3">—</div></div>
</div>

<div class="tabs">
  <button class="tab on" id="tab-inv" onclick="switchTab('inv')">☰庫存列表</button>
  <button class="tab" id="tab-ai" onclick="switchTab('ai')">✦AI 調色建議</button>
</div>

<div class="panel on" id="p-inv">
  <div class="card">
    <table><thead><tr>
      <th class="c0"></th><th class="c1">名稱</th><th class="c2">品牌</th>
      <th class="c3">色號</th><th class="c4">類型</th><th class="c5">用法</th>
      <th class="c6">數量</th><th class="c7">狀態</th><th class="c8"></th>
    </tr></thead>
    <tbody id="tb"></tbody></table>
    <div class="empty" id="emp" style="display:none">○沒有符合的漆料</div>
  </div>
</div>

<div class="panel" id="p-ai">
  <div style="background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:2rem;text-align:center">
    <div style="font-size:48px;margin-bottom:1rem">🎨</div>
    <div style="font-size:16px;font-weight:500;margin-bottom:.5rem;color:var(--text)">AI 調色建議</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:1.5rem;line-height:1.7">
      在 Claude 詢問調色建議，<br>Claude 可以即時讀取你的 Google Sheets 庫存，<br>給出最精確的推薦。
    </div>
    <a href="https://claude.ai" target="_blank" class="btn btn-p" style="text-decoration:none;padding:0 24px;height:40px;font-size:14px">
      ↗ 開啟 Claude 詢問調色
    </a>
    <div style="margin-top:1.25rem;background:var(--bg2);border-radius:var(--r);padding:1rem;text-align:left;font-size:12px;color:var(--text2);line-height:1.9">
      <div style="font-weight:500;color:var(--text);margin-bottom:.4rem">💡 範例問法：</div>
      <div>・我想漆夏亞的薩克，從我的庫存推薦紅色系調色步驟</div>
      <div>・我有哪些藍色系漆料可以做漸層？</div>
      <div>・幫我看庫存，推薦鋼彈白色裝甲的噴塗順序</div>
      <div>・我想做舊化效果，庫存裡有什麼可以用？</div>
    </div>
  </div>
</div>
</div>

<div id="mc"></div>
<div class="toast" id="toast"></div>

let paints = [], editId = null;

function setSyncStatus(state, msg) {
  const dot = document.getElementById('sdot');
  const m = document.getElementById('smsg');
  dot.className = 'sdot ' + (state === 'ok' ? 'ok' : state === 'spin' ? 'spin' : 'err');
  m.textContent = msg;
}

function parseCSVLine(line) {
  const r = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (c === ',' && !inQ) { r.push(cur); cur = ''; }
    else cur += c;
  }
  r.push(cur); return r;
}
function clean(s) { return s ? s.replace(/^["']|["']$/g,'').trim() : ''; }
function guessColor(n) {
  if(/白|White/.test(n)) return '#f5f5f5';
  if(/黑|Black/.test(n)) return '#1a1a1a';
  if(/紅|Red/.test(n)) return '#c0392b';
  if(/藍|Blue/.test(n)) return '#2980b9';
  if(/綠|Green/.test(n)) return '#27ae60';
  if(/黃|Yellow/.test(n)) return '#f1c40f';
  if(/橘|Orange/.test(n)) return '#e67e22';
  if(/紫|Purple/.test(n)) return '#8e44ad';
  if(/粉|Pink/.test(n)) return '#fd79a8';
  if(/灰|Grey|Gray/.test(n)) return '#7f8c8d';
  if(/金|Gold/.test(n)) return '#f0c040';
  if(/銀|Silver/.test(n)) return '#bdc3c7';
  if(/銅|Bronze|Copper/.test(n)) return '#cd7f32';
  return '#aaaaaa';
}

async function fetchSheets() {
  setSyncStatus('spin', '正在讀取 Google Sheets...');
  const btn = document.getElementById('refresh-btn');
  btn.innerHTML = '⟳';
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const lines = text.trim().split('\n');
    const result = []; let id = 1;
    for (let i = 1; i < lines.length; i++) {
      const row = parseCSVLine(lines[i]);
      if (row.length < 4) continue;
      const brand = clean(row[0]), code = clean(row[1]), name = clean(row[2]);
      const qty = parseFloat(clean(row[3])) || 0;
      const tag = row[5] ? clean(row[5]) : '噴塗';
      if (!name || !code) continue;
      const color = COLOR_MAP[code] || guessColor(name);
      let type = '基本色';
      if (/^P-|^PP-/.test(code)) type = '底漆';
      else if (/^CP|^CPP/.test(code)) type = '透明漆';
      else if (/^CL|^ML|^MC-/.test(code)) type = '金屬漆';
      else if (/^SWP/.test(code)) type = '陰影';
      else if (/^FLP/.test(code)) type = '特效';
      let b = brand;
      if (/九五二|9527/.test(brand)) b = '九五二漆';
      else if (/^AV$|vallejo/i.test(brand)) b = 'Vallejo';
      result.push({ id: id++, name, brand: b, code, type, qty, color, tag, note: '' });
    }
    if (result.length > 0) {
      paints = result;
      localStorage.setItem(LKEY, JSON.stringify(paints));
      setSyncStatus('ok', `已載入 ${paints.length} 筆 — ${new Date().toLocaleTimeString('zh-TW')}`);
      render();
    } else throw new Error('資料為空');
  } catch(e) {
    const cached = localStorage.getItem(LKEY);
    if (cached) { paints = JSON.parse(cached); setSyncStatus('err', '使用本地快取（無法連線 Sheets）'); render(); }
    else { setSyncStatus('err', '讀取失敗：' + e.message); }
  }
  btn.innerHTML = '↻';
}

// Vallejo 依色號分頁
const SHOPEE_STORE = 'https://shopee.tw/people3x3';
const VALLEJO_MAP = {
  'base_1': 'https://shopee.tw/-%E4%BB%8E%E4%BA%BA-AV-Vallejo-Mecha-%E5%9F%BA%E7%A4%8E%E8%89%B2-69.001~025-%E6%B0%B4%E6%80%A7%E6%BC%86-AV%E6%BC%86-%E6%A9%9F%E7%94%B2%E8%89%B2-AV%E6%B0%B4%E6%BC%86-i.944671855.27706691700',
  'base_2': 'https://shopee.tw/-%E4%BB%8E%E4%BA%BA-AV-Vallejo-Mecha-%E5%9F%BA%E7%A4%8E%E8%89%B2-69.026~042-%E6%A9%9F%E7%94%B2%E7%B3%BB%E5%88%97-%E6%B0%B4%E6%80%A7%E6%BC%86-AV%E6%BC%86-%E6%A9%9F%E7%94%B2%E8%89%B2-AV%E6%B0%B4%E6%BC%86-i.944671855.26906693697',
  'special': 'https://shopee.tw/-%E4%BB%8E%E4%BA%BA-AV-Vallejo-Mecha-%E8%9E%A2%E5%85%89%E8%89%B2-%E9%87%91%E5%B1%AC%E8%89%B2-%E6%BC%AC%E6%B4%97%E6%B6%B2-%E6%A9%9F%E7%94%B2%E7%B3%BB%E5%88%97-%E6%B0%B4%E6%80%A7%E6%BC%86-AV%E6%BC%86-%E6%A9%9F%E7%94%B2%E8%89%B2-i.944671855.27006700184',
  'primer': 'https://shopee.tw/-%E4%BB%8E%E4%BA%BA-AV-Vallejo-Mecha-%E9%80%8F%E6%98%8E%E6%BC%86-%E5%BA%95%E6%BC%86-%E6%A9%9F%E7%94%B2%E7%B3%BB%E5%88%97-%E4%BF%9D%E8%AD%B7%E6%BC%86-%E5%BA%95%E8%89%B2-%E6%B0%B4%E6%80%A7%E6%BC%86-%E6%A9%9F%E7%94%B2%E8%89%B2-i.944671855.28206704003',
};

function getVallejoUrl(code) {
  // 70.640~642 → 底漆頁
  // 69.001~025 → 基礎色第一頁
  // 69.026~042 → 基礎色第二頁
  // 其他 → 螢光/金屬/漬洗頁
  if (code.startsWith('70.')) return VALLEJO_MAP['primer'];
  const m = code.match(/^69\.0*(\d+)/);
  if (m) {
    const n = parseInt(m[1]);
    if (n <= 25) return VALLEJO_MAP['base_1'];
    if (n <= 42) return VALLEJO_MAP['base_2'];
  }
  return VALLEJO_MAP['special'];
}

function getShopUrl(p) {
  if (p.brand === 'Vallejo') return getVallejoUrl(p.code);
  const code = p.code;
  // ME 系列需要依號碼分三段
  const meNum = code.match(/^ME-(\d+)$/);
  if (meNum) {
    const n = parseInt(meNum[1]);
    if (n <= 20) return SHOP_MAP['ME-0[1-9]$|ME-1[0-9]$|ME-20$'];
    if (n <= 40) return SHOP_MAP['ME-2[1-9]$|ME-3[0-9]$|ME-40$'];
    return SHOP_MAP['ME-4[1-9]$|ME-5[0-9]$'];
  }
  // MEC 系列分兩段
  const mecNum = code.match(/^MEC-(\d+)$/);
  if (mecNum) {
    const n = parseInt(mecNum[1]);
    if (n <= 31) return SHOP_MAP['MEC-([0-2][0-9]|30|31)$'];
    return SHOP_MAP['MEC-([3-5][0-9]|54)$'];
  }
  // 其他系列直接前綴匹配（長的優先）
  const prefixes = ['CPP','CLP','SWP','FLP','MCP','MC','ML','BP','AB','PP','CP','CL','P'];
  for (const k of prefixes) {
    if (code.startsWith(k)) return SHOP_MAP[k] || SHOPEE_STORE;
  }
  return SHOPEE_STORE;
}

function bb(p) {
  if (p.brand === '九五二漆') return '<span class="badge b9">九五二漆</span>';
  if (p.brand === 'Vallejo') return '<span class="badge bv">Vallejo</span>';
  return `<span class="badge bot">${p.brand}</span>`;
}
function sb(q) {
  if (q === 0) return '<span class="badge bempty">用完</span>';
  if (q <= 1) return '<span class="badge blow">不足</span>';
  return '<span class="badge bok">充足</span>';
}
function filt() {
  const q = document.getElementById('q').value.toLowerCase();
  const fb = document.getElementById('fb').value;
  const ft = document.getElementById('ft').value;
  const ftag = document.getElementById('ftag').value;
  const fs = document.getElementById('fstock').value;
  return paints.filter(p => {
    const mq = !q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || (p.note||'').toLowerCase().includes(q);
    const ms = !fs || (fs==='in'&&p.qty>0) || (fs==='out'&&p.qty===0);
    return mq && (!fb||p.brand===fb) && (!ft||p.type===ft) && (!ftag||p.tag===ftag) && ms;
  });
}
function render() {
  const list = filt();
  const tb = document.getElementById('tb');
  const emp = document.getElementById('emp');
  if (!list.length) { tb.innerHTML = ''; emp.style.display = 'block'; }
  else {
    emp.style.display = 'none';
    tb.innerHTML = list.map(p => `<tr>
      <td class="c0"><span class="dot" style="background:${p.color||'#ccc'}"></span></td>
      <td class="c1" title="${p.name}">${p.name}</td>
      <td class="c2">${bb(p)}</td><td class="c3">${p.code}</td>
      <td class="c4"><span class="badge btype">${p.type}</span></td>
      <td class="c5">${p.tag||''}</td><td class="c6">${p.qty}罐</td>
      <td class="c7">${sb(p.qty)}</td>
      <td class="c8">
        <button class="abtn" onclick="openEdit(${p.id})" title="編輯">✎</button>
        <button class="abtn delbtn" onclick="del(${p.id})" title="刪除">✕</button>
        <a class="abtn" href="${getShopUrl(p)}" target="_blank" title="購買" style="display:inline-flex;align-items:center;text-decoration:none;${p.qty===0?'color:var(--dtx)':p.qty<=1?'color:var(--wtx)':'color:var(--text2)'}">🛒</a>
      </td></tr>`).join('');
  }
  document.getElementById('s0').textContent = paints.length;
  document.getElementById('s1').textContent = paints.filter(p=>p.qty>1).length;
  document.getElementById('s2').textContent = paints.filter(p=>p.qty>0&&p.qty<=1).length;
  document.getElementById('s3').textContent = paints.filter(p=>p.qty===0).length;
}

function switchTab(name) {
  ['inv','ai'].forEach(n => {
    document.getElementById('tab-'+n).classList.toggle('on', n===name);
    document.getElementById('p-'+n).classList.toggle('on', n===name);
  });
  if (name === 'ai') checkKey();
}

function nextId() { return paints.length ? Math.max(...paints.map(p=>p.id))+1 : 1; }
function saveLocal() { localStorage.setItem(LKEY, JSON.stringify(paints)); }

function openAdd() { editId=null; showModal({id:null,name:'',brand:'九五二漆',code:'',type:'基本色',qty:1,color:'#cccccc',tag:'噴塗',note:''}); }
function openEdit(id) { editId=id; const p=paints.find(x=>x.id===id); if(p) showModal({...p}); }

function showModal(p) {
  const n = !p.id;
  document.getElementById('mc').innerHTML = `
  <div class="mbg" onclick="if(event.target===this)closeMod()">
    <div class="modal">
      <h2>${n?'新增漆料':'編輯漆料'}</h2>
      <div class="fi"><label>漆料名稱</label><input type="text" id="fn" value="${p.name}" placeholder="例：白練"></div>
      <div class="r2">
        <div class="fi"><label>品牌</label>
          <select id="fb2">${['九五二漆','Vallejo','其他'].map(b=>`<option ${p.brand===b?'selected':''}>${b}</option>`).join('')}</select>
        </div>
        <div class="fi"><label>色號</label><input type="text" id="fc" value="${p.code}"></div>
      </div>
      <div class="r2">
        <div class="fi"><label>類型</label>
          <select id="ftype">${['基本色','底漆','金屬漆','透明漆','陰影','特效'].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select>
        </div>
        <div class="fi"><label>用法</label>
          <select id="ftag2">${['噴塗','筆塗'].map(t=>`<option ${(p.tag||'噴塗')===t?'selected':''}>${t}</option>`).join('')}</select>
        </div>
      </div>
      <div class="r2">
        <div class="fi"><label>數量（罐）</label><input type="number" id="fq" value="${p.qty}" min="0" max="99" step="0.5"></div>
        <div class="fi"><label>顏色</label><input type="color" id="fcolor" value="${p.color||'#cccccc'}" style="height:34px;padding:2px"></div>
      </div>
      <div class="fi"><label>備注</label><input type="text" id="fnote" value="${p.note||''}" placeholder="可留空"></div>
      <div class="mact">
        <button class="btn" onclick="closeMod()">取消</button>
        <button class="btn btn-p" onclick="savePaint()">儲存</button>
      </div>
    </div>
  </div>`;
}
function closeMod() { document.getElementById('mc').innerHTML = ''; }
function savePaint() {
  const name = document.getElementById('fn').value.trim();
  if (!name) { alert('請輸入漆料名稱'); return; }
  const paint = {
    id: editId||nextId(), name,
    brand: document.getElementById('fb2').value,
    code: document.getElementById('fc').value.trim(),
    type: document.getElementById('ftype').value,
    tag: document.getElementById('ftag2').value,
    qty: parseFloat(document.getElementById('fq').value)||0,
    color: document.getElementById('fcolor').value,
    note: document.getElementById('fnote').value.trim()
  };
  if (editId) { const i=paints.findIndex(p=>p.id===editId); paints[i]=paint; toast('已更新 '+name); }
  else { paints.push(paint); toast('已新增 '+name); }
  saveLocal(); closeMod(); render();
}
function del(id) {
  const p = paints.find(x=>x.id===id);
  if (!p||!confirm(`確定要刪除「${p.name}」？`)) return;
  paints = paints.filter(x=>x.id!==id);
  saveLocal(); render(); toast('已刪除');
}
function exportCSV() {
  const rows=[['名稱','品牌','色號','類型','用法','數量','備注']];
  paints.forEach(p=>rows.push([p.name,p.brand,p.code,p.type,p.tag||'',p.qty,p.note||'']));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='paints.csv'; a.click(); toast('CSV 已匯出');
}


// ── 密碼登入 ──
// 密碼的 SHA-256 hash，預設密碼請自行設定
// 第一次輸入任意密碼會自動設為你的密碼
const AUTH_KEY = 'pm_pwd_v2';
const AUTH_EXP = 'pm_pwd_exp';
const DAYS = 30;

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function unlock() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-wrap').style.display = 'block';
  fetchSheets();
}

async function doLogin() {
  const pwd = document.getElementById('pwd').value.trim();
  if (!pwd) return;
  const hash = await sha256(pwd);
  const saved = localStorage.getItem(AUTH_KEY);
  if (!saved) {
    // 第一次：設定密碼
    localStorage.setItem(AUTH_KEY, hash);
    setExp();
    unlock();
    return;
  }
  if (hash === saved) {
    setExp();
    unlock();
  } else {
    const e = document.getElementById('login-err');
    e.textContent = '密碼錯誤，請再試一次';
    document.getElementById('pwd').value = '';
    setTimeout(() => e.textContent = '', 2500);
  }
}

function setExp() {
  localStorage.setItem(AUTH_EXP, Date.now() + DAYS * 86400000);
}

function checkAuth() {
  const saved = localStorage.getItem(AUTH_KEY);
  const exp = parseInt(localStorage.getItem(AUTH_EXP) || '0');
  if (saved && Date.now() < exp) {
    unlock();
  }
  // 否則顯示登入頁
}

document.getElementById('pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogout() {
  localStorage.removeItem(AUTH_KEY);
  localStorage.removeItem(AUTH_EXP);
  document.getElementById('main-wrap').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwd').value = '';
}

checkAuth();
</script>
