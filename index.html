<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漆料庫存管理 — 線上版</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">
<style>
:root {
  --bg:#fff;--bg2:#f5f5f3;--bg3:#eeede9;--text:#1a1a18;--text2:#6b6b67;
  --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.2);--r:8px;--rl:12px;
  --ibg:#e6f1fb;--itx:#0c447c;--okbg:#eaf3de;--oktx:#3b6d11;
  --wbg:#faeeda;--wtx:#854f0b;--dbg:#fcebeb;--dtx:#a32d2d;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1c1c1a;--bg2:#252523;--bg3:#2e2e2c;--text:#f0ede8;--text2:#8a8a86;
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);
  --ibg:#042c53;--itx:#85b7eb;--okbg:#173404;--oktx:#97c459;--wbg:#412402;--wtx:#ef9f27;--dbg:#501313;--dtx:#f09595;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
.wrap{max-width:1020px;margin:0 auto;padding:1.25rem 1rem}
header{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
h1{font-size:19px;font-weight:600;flex:1;display:flex;align-items:center;gap:7px}
h1 .ti{font-size:20px;color:var(--text2)}
.ctrls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
input[type=text],select{height:34px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);padding:0 9px;font-size:13px;outline:none}
input[type=text]:focus,select:focus{border-color:var(--text2)}
.sw{position:relative}.sw input{padding-left:28px}.sw .ti{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text2);pointer-events:none}
.btn{height:34px;padding:0 12px;border-radius:var(--r);border:.5px solid var(--border2);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;background:var(--bg);color:var(--text);transition:background .15s}
.btn:hover{background:var(--bg2)}
.btn-p{background:var(--text);color:var(--bg);border-color:transparent}
.btn-p:hover{opacity:.85;background:var(--text)}
.btn-green{background:#3b6d11;color:#fff;border-color:transparent}
.btn-green:hover{opacity:.85}
/* sync bar */
.sync-bar{display:flex;align-items:center;gap:8px;padding:.5rem .85rem;background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);margin-bottom:1rem;font-size:12px;color:var(--text2)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);flex-shrink:0}
.sync-dot.ok{background:#5dcaa5}
.sync-dot.loading{background:#ef9f27;animation:pulse 1s ease-in-out infinite}
.sync-dot.err{background:var(--dtx)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.1rem}
.stat{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:.6rem .9rem}
.sl{font-size:11px;color:var(--text2);margin-bottom:2px}
.sv{font-size:21px;font-weight:600}
.sv.w{color:var(--wtx)}.sv.d{color:var(--dtx)}
.tabs{display:flex;gap:2px;border-bottom:.5px solid var(--border);margin-bottom:.9rem}
.tab{padding:7px 14px;font-size:13px;border:none;background:none;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.panel{display:none}.panel.on{display:block}
.card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{background:var(--bg2);padding:8px 9px;text-align:left;font-weight:500;font-size:11px;color:var(--text2);border-bottom:.5px solid var(--border)}
td{padding:8px 9px;border-bottom:.5px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.dot{width:18px;height:18px;border-radius:4px;border:.5px solid var(--border2);display:inline-block;vertical-align:middle;flex-shrink:0}
.badge{display:inline-block;padding:2px 6px;border-radius:var(--r);font-size:11px;font-weight:500}
.b9{background:#e2f5d8;color:#3b6d11}.bv{background:#dbeeff;color:#0c447c}.bot{background:var(--wbg);color:var(--wtx)}
.btype{background:var(--ibg);color:var(--itx)}
.bok{background:var(--okbg);color:var(--oktx)}.blow{background:var(--wbg);color:var(--wtx)}.bempty{background:var(--dbg);color:var(--dtx)}
.abtn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:14px;padding:3px;border-radius:4px}
.abtn:hover{color:var(--text);background:var(--bg2)}
.delbtn:hover{color:var(--dtx)}
.empty{text-align:center;padding:2.5rem;color:var(--text2);font-size:13px}
.empty .ti{font-size:30px;display:block;margin-bottom:8px}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--bg);border-radius:var(--rl);border:.5px solid var(--border2);padding:1.25rem;width:360px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal h2{font-size:15px;font-weight:600;margin-bottom:.9rem}
.fi{margin-bottom:10px}.fi label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px}
.fi input,.fi select{width:100%}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mact{display:flex;gap:8px;margin-top:1rem;justify-content:flex-end}
/* ai */
.ai-note{font-size:12px;color:var(--text2);margin-bottom:.75rem;line-height:1.6}
.ai-row{display:flex;gap:8px;margin-bottom:.9rem}
.ai-row input{flex:1;font-size:13px}
.ai-box{border:.5px solid var(--border);border-radius:var(--rl);padding:1rem;background:var(--bg2);min-height:140px;font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap}
/* toast */
.toast{position:fixed;bottom:1.25rem;right:1.25rem;background:var(--text);color:var(--bg);padding:.55rem .9rem;border-radius:var(--r);font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* col widths */
.c0{width:32px}.c1{width:22%}.c2{width:12%}.c3{width:11%}.c4{width:10%}.c5{width:7%}.c6{width:9%}.c7{width:9%}.c8{width:8%;text-align:right}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.c3,.c4{display:none}}
/* pending badge */
.pending-bar{background:var(--wbg);border:.5px solid var(--wtx);border-radius:var(--r);padding:.5rem .85rem;font-size:12px;color:var(--wtx);margin-bottom:.75rem;display:none;align-items:center;gap:8px}
.pending-bar.show{display:flex}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><i class="ti ti-palette"></i>漆料庫存管理 <span style="font-size:11px;font-weight:400;color:var(--text2);margin-left:4px">線上版</span></h1>
  <div class="ctrls">
    <div class="sw"><i class="ti ti-search"></i><input type="text" id="q" placeholder="名稱、色號..."></div>
    <select id="fb"><option value="">全部品牌</option><option>九五二漆</option><option>Vallejo</option></select>
    <select id="ft"><option value="">全部類型</option><option>基本色</option><option>底漆</option><option>金屬漆</option><option>透明漆</option><option>陰影</option><option>特效</option></select>
    <select id="ftag"><option value="">噴塗+筆塗</option><option>噴塗</option><option>筆塗</option></select>
    <select id="fstock"><option value="">全部庫存</option><option value="in">有庫存</option><option value="out">已用完</option></select>
    <button class="btn btn-p" onclick="openAdd()"><i class="ti ti-plus"></i>新增</button>
    <button class="btn" onclick="fetchFromSheets()" id="sync-btn" title="從 Google Sheets 重新讀取"><i class="ti ti-refresh"></i></button>
    <button class="btn" onclick="exportCSV()"><i class="ti ti-download"></i>CSV</button>
  </div>
</header>

<div class="sync-bar">
  <div class="sync-dot" id="sync-dot"></div>
  <span id="sync-msg">正在讀取 Google Sheets 資料...</span>
  <span style="flex:1"></span>
  <a id="sheets-link" href="https://docs.google.com/spreadsheets/d/1aFWuIyYVYrD8HIhiZPka_uUqodmldx5QSeCHBBn4y-w/edit" target="_blank" style="color:var(--itx);font-size:12px;text-decoration:none"><i class="ti ti-external-link" style="font-size:12px"></i> 在 Sheets 編輯</a>
</div>

<div class="pending-bar" id="pending-bar">
  <i class="ti ti-alert-triangle"></i>
  <span id="pending-msg"></span>
  <span style="flex:1"></span>
  <button class="btn" style="height:26px;font-size:12px;padding:0 8px" onclick="syncToSheets()"><i class="ti ti-upload"></i> 同步回 Sheets</button>
  <button class="btn" style="height:26px;font-size:12px;padding:0 8px;margin-left:4px" onclick="discardChanges()">放棄</button>
</div>

<div class="stats">
  <div class="stat"><div class="sl">總漆料數</div><div class="sv" id="s0">—</div></div>
  <div class="stat"><div class="sl">有庫存</div><div class="sv" id="s1">—</div></div>
  <div class="stat"><div class="sl">庫存不足</div><div class="sv w" id="s2">—</div></div>
  <div class="stat"><div class="sl">已用完</div><div class="sv d" id="s3">—</div></div>
</div>

<div class="tabs">
  <button class="tab on" onclick="switchTab('inv',this)"><i class="ti ti-list"></i> 庫存列表</button>
  <button class="tab" onclick="switchTab('ai',this)"><i class="ti ti-wand"></i> AI 調色建議</button>
</div>

<div class="panel on" id="p-inv">
  <div class="card">
    <table><thead><tr>
      <th class="c0"></th>
      <th class="c1">名稱</th>
      <th class="c2">品牌</th>
      <th class="c3">色號</th>
      <th class="c4">類型</th>
      <th class="c5">用法</th>
      <th class="c6">數量</th>
      <th class="c7">狀態</th>
      <th class="c8"></th>
    </tr></thead>
    <tbody id="tb"></tbody></table>
    <div class="empty" id="emp" style="display:none"><i class="ti ti-mood-empty"></i>沒有符合的漆料</div>
  </div>
</div>

<div class="panel" id="p-ai">
  <div style="background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:2rem;text-align:center">
    <div style="font-size:48px;margin-bottom:1rem">🎨</div>
    <div style="font-size:16px;font-weight:500;margin-bottom:.5rem;color:var(--text)">AI 調色建議</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:1.5rem;line-height:1.7">
      直接在 Claude 詢問調色建議，<br>Claude 可以即時讀取你的 Google Sheets 庫存，<br>給出最精確的推薦。
    </div>
    <a href="https://claude.ai" target="_blank" class="btn btn-p" style="display:inline-flex;text-decoration:none;padding:0 24px;height:40px;font-size:14px;gap:8px">
      <i class="ti ti-external-link"></i> 開啟 Claude 詢問調色
    </a>
    <div style="margin-top:1.25rem;background:var(--bg2);border-radius:var(--r);padding:1rem;text-align:left;font-size:12px;color:var(--text2);line-height:1.8">
      <div style="font-weight:500;color:var(--text);margin-bottom:.4rem">💡 範例問法：</div>
      <div>・我想漆夏亞的薩克，從我的庫存推薦紅色系調色步驟</div>
      <div>・我有哪些藍色系漆料可以做漸層？</div>
      <div>・幫我看庫存，推薦鋼彈白色裝甲的噴塗順序</div>
      <div>・我想做舊化效果，庫存裡有什麼可以用？</div>
    </div>
  </div>
</div>
</div>

<div id="mc"></div>
<div class="toast" id="toast"></div>

<script>

const LOCAL_KEY = 'pm_online_v1';
let paints = [];
let pendingChanges = false;
let editId = null;

// ============================================================
// 同步狀態 UI
// ============================================================
function setSyncStatus(state, msg) {
  const dot = document.getElementById('sync-dot');
  const msgEl = document.getElementById('sync-msg');
  dot.className = 'sync-dot ' + (state === 'ok' ? 'ok' : state === 'loading' ? 'loading' : 'err');
  msgEl.textContent = msg;
}

// ============================================================
// 從 Google Sheets 讀取（公開 CSV）
// ============================================================
async function fetchFromSheets() {
  setSyncStatus('loading', '正在從 Google Sheets 讀取最新資料...');
  document.getElementById('sync-btn').innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i>';
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = parseCSV(text);
    if (parsed.length > 0) {
      paints = parsed;
      localStorage.setItem(LOCAL_KEY, JSON.stringify(paints));
      pendingChanges = false;
      updatePendingBar();
      setSyncStatus('ok', `已從 Google Sheets 載入 ${paints.length} 筆資料 — ${new Date().toLocaleTimeString('zh-TW')}`);
      render();
    } else {
      throw new Error('解析結果為空');
    }
  } catch(e) {
    console.error(e);
    // 嘗試從 localStorage 載入
    const cached = localStorage.getItem(LOCAL_KEY);
    if (cached) {
      paints = JSON.parse(cached);
      setSyncStatus('err', '無法連線 Google Sheets，使用本地快取資料');
      render();
    } else {
      setSyncStatus('err', '無法讀取資料：' + e.message);
    }
  }
  document.getElementById('sync-btn').innerHTML = '<i class="ti ti-refresh"></i>';
}

// ============================================================
// 解析 Google Sheets CSV（欄位：品牌,色號,名稱,庫存數量,圖片路徑,標籤）
// ============================================================
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const result = [];
  let id = 1;
  // skip header row
  for (let i = 1; i < lines.length; i++) {
    const row = parseCSVLine(lines[i]);
    if (row.length < 4) continue;
    const brand = clean(row[0]);
    const code  = clean(row[1]);
    const name  = clean(row[2]);
    const qty   = parseFloat(clean(row[3])) || 0;
    const tag   = row[5] ? clean(row[5]) : '噴塗';
    if (!name || !code) continue;

    // 對應顏色
    const color = COLOR_MAP[code] || guessColor(name);

    // 判斷類型
    let type = '基本色';
    if (code.startsWith('P-') || code.startsWith('PP-')) type = '底漆';
    else if (code.startsWith('CP') || code.startsWith('CPP')) type = '透明漆';
    else if (code.startsWith('CL') || code.startsWith('ML') || code.startsWith('MC-')) type = '金屬漆';
    else if (code.startsWith('SWP')) type = '陰影';
    else if (code.startsWith('FLP')) type = '特效';
    else if (brand === 'AV' && code.startsWith('70.')) type = '底漆';

    // 標準化品牌名稱
    let brandName = brand;
    if (brand === '九五二漆' || brand.includes('9527') || brand.includes('九五二')) brandName = '九五二漆';
    else if (brand === 'AV' || brand.toLowerCase().includes('vallejo')) brandName = 'Vallejo';

    result.push({ id: id++, name, brand: brandName, code, type, qty, color, tag, note: '' });
  }
  return result;
}

function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) {
      result.push(cur); cur = '';
    } else cur += c;
  }
  result.push(cur);
  return result;
}

function clean(s) {
  return s ? s.replace(/^["']|["']$/g, '').trim() : '';
}

function guessColor(name) {
  if (name.includes('白') || name.includes('White')) return '#f5f5f5';
  if (name.includes('黑') || name.includes('Black')) return '#1a1a1a';
  if (name.includes('紅') || name.includes('Red')) return '#c0392b';
  if (name.includes('藍') || name.includes('Blue')) return '#2980b9';
  if (name.includes('綠') || name.includes('Green')) return '#27ae60';
  if (name.includes('黃') || name.includes('Yellow')) return '#f1c40f';
  if (name.includes('橘') || name.includes('Orange')) return '#e67e22';
  if (name.includes('紫') || name.includes('Purple')) return '#8e44ad';
  if (name.includes('粉') || name.includes('Pink')) return '#fd79a8';
  if (name.includes('灰') || name.includes('Grey') || name.includes('Gray')) return '#7f8c8d';
  if (name.includes('金') || name.includes('Gold')) return '#f0c040';
  if (name.includes('銀') || name.includes('Silver')) return '#bdc3c7';
  if (name.includes('銅') || name.includes('Bronze') || name.includes('Copper')) return '#cd7f32';
  return '#aaaaaa';
}

// ============================================================
// Pending changes UI
// ============================================================
function updatePendingBar() {
  const bar = document.getElementById('pending-bar');
  const msg = document.getElementById('pending-msg');
  if (pendingChanges) {
    bar.classList.add('show');
    msg.textContent = '有未同步的本地變更';
  } else {
    bar.classList.remove('show');
  }
}

function syncToSheets() {
  window.open(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`, '_blank');
  toast('已開啟 Google Sheets，請手動更新資料後按右上角「重新讀取」');
}

function discardChanges() {
  if (confirm('放棄本地變更，重新從 Sheets 載入？')) {
    pendingChanges = false;
    fetchFromSheets();
  }
}

// ============================================================
// Render
// ============================================================
function bb(p) {
  if (p.brand === '九五二漆') return `<span class="badge b9">九五二漆</span>`;
  if (p.brand === 'Vallejo') return `<span class="badge bv">Vallejo</span>`;
  return `<span class="badge bot">${p.brand}</span>`;
}
function sb(q) {
  if (q === 0) return '<span class="badge bempty">用完</span>';
  if (q <= 1) return '<span class="badge blow">不足</span>';
  return '<span class="badge bok">充足</span>';
}

function filt() {
  const q = document.getElementById('q').value.toLowerCase();
  const fb = document.getElementById('fb').value;
  const ft = document.getElementById('ft').value;
  const ftag = document.getElementById('ftag').value;
  const fs = document.getElementById('fstock').value;
  return paints.filter(p => {
    const mq = !q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || (p.note||'').toLowerCase().includes(q);
    const ms = !fs || (fs === 'in' && p.qty > 0) || (fs === 'out' && p.qty === 0);
    return mq && (!fb || p.brand === fb) && (!ft || p.type === ft) && (!ftag || p.tag === ftag) && ms;
  });
}

function render() {
  const list = filt();
  const tb = document.getElementById('tb');
  const emp = document.getElementById('emp');
  if (!list.length) { tb.innerHTML = ''; emp.style.display = 'block'; }
  else {
    emp.style.display = 'none';
    tb.innerHTML = list.map(p => `<tr>
      <td class="c0"><span class="dot" style="background:${p.color||'#ccc'}"></span></td>
      <td class="c1" title="${p.name}">${p.name}</td>
      <td class="c2">${bb(p)}</td>
      <td class="c3">${p.code}</td>
      <td class="c4"><span class="badge btype">${p.type}</span></td>
      <td class="c5">${p.tag||''}</td>
      <td class="c6">${p.qty} 罐</td>
      <td class="c7">${sb(p.qty)}</td>
      <td class="c8">
        <button class="abtn" onclick="openEdit(${p.id})" title="編輯"><i class="ti ti-edit"></i></button>
        <button class="abtn delbtn" onclick="del(${p.id})" title="刪除"><i class="ti ti-trash"></i></button>
      </td>
    </tr>`).join('');
  }
  document.getElementById('s0').textContent = paints.length;
  document.getElementById('s1').textContent = paints.filter(p => p.qty > 1).length;
  document.getElementById('s2').textContent = paints.filter(p => p.qty > 0 && p.qty <= 1).length;
  document.getElementById('s3').textContent = paints.filter(p => p.qty === 0).length;
}

// ============================================================
// CRUD（本地操作，標記為 pending）
// ============================================================
function nextId() { return paints.length ? Math.max(...paints.map(p => p.id)) + 1 : 1; }
function saveLocal() {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(paints));
  pendingChanges = true;
  updatePendingBar();
}

function openAdd() { editId = null; showModal({ id: null, name: '', brand: '九五二漆', code: '', type: '基本色', qty: 1, color: '#cccccc', tag: '噴塗', note: '' }); }
function openEdit(id) { editId = id; const p = paints.find(x => x.id === id); if (p) showModal({...p}); }

function showModal(p) {
  const n = !p.id;
  document.getElementById('mc').innerHTML = `
  <div class="mbg" onclick="if(event.target===this)closeMod()">
    <div class="modal">
      <h2>${n ? '新增漆料' : '編輯漆料'}</h2>
      <div class="fi"><label>漆料名稱</label><input type="text" id="fn" value="${p.name}" placeholder="例：白練"></div>
      <div class="r2">
        <div class="fi"><label>品牌</label>
          <select id="fb2">${['九五二漆','Vallejo','其他'].map(b=>`<option ${p.brand===b?'selected':''}>${b}</option>`).join('')}</select>
        </div>
        <div class="fi"><label>色號</label><input type="text" id="fc" value="${p.code}"></div>
      </div>
      <div class="r2">
        <div class="fi"><label>類型</label>
          <select id="ftype">${['基本色','底漆','金屬漆','透明漆','陰影','特效'].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select>
        </div>
        <div class="fi"><label>用法</label>
          <select id="ftag2">${['噴塗','筆塗'].map(t=>`<option ${(p.tag||'噴塗')===t?'selected':''}>${t}</option>`).join('')}</select>
        </div>
      </div>
      <div class="r2">
        <div class="fi"><label>數量（罐）</label><input type="number" id="fq" value="${p.qty}" min="0" max="99" step="0.5"></div>
        <div class="fi"><label>顏色</label><input type="color" id="fcolor" value="${p.color||'#cccccc'}" style="height:34px;padding:2px"></div>
      </div>
      <div class="fi"><label>備注</label><input type="text" id="fnote" value="${p.note||''}" placeholder="可留空"></div>
      <div class="mact">
        <button class="btn" onclick="closeMod()">取消</button>
        <button class="btn btn-p" onclick="savePaint()">儲存</button>
      </div>
    </div>
  </div>`;
}
function closeMod() { document.getElementById('mc').innerHTML = ''; }

function savePaint() {
  const name = document.getElementById('fn').value.trim();
  if (!name) { alert('請輸入漆料名稱'); return; }
  const paint = {
    id: editId || nextId(), name,
    brand: document.getElementById('fb2').value,
    code: document.getElementById('fc').value.trim(),
    type: document.getElementById('ftype').value,
    tag: document.getElementById('ftag2').value,
    qty: parseFloat(document.getElementById('fq').value) || 0,
    color: document.getElementById('fcolor').value,
    note: document.getElementById('fnote').value.trim(),
  };
  if (editId) { const i = paints.findIndex(p => p.id === editId); paints[i] = paint; toast('已更新 ' + name); }
  else { paints.push(paint); toast('已新增 ' + name); }
  saveLocal(); closeMod(); render();
}

function del(id) {
  const p = paints.find(x => x.id === id);
  if (!p || !confirm(`確定要刪除「${p.name}」？`)) return;
  paints = paints.filter(x => x.id !== id);
  saveLocal(); render(); toast('已刪除');
}

function exportCSV() {
  const rows = [['名稱','品牌','色號','類型','用法','數量','備注']];
  paints.forEach(p => rows.push([p.name, p.brand, p.code, p.type, p.tag||'', p.qty, p.note||'']));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF' + csv], {type: 'text/csv;charset=utf-8'}));
  a.download = 'paints_export.csv'; a.click(); toast('CSV 已匯出');
}

function switchTab(n, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('p-' + n).classList.add('on');
}


function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// CSS spin
const style = document.createElement('style');
style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
document.head.appendChild(style);

['q','fb','ft','ftag','fstock'].forEach(id => document.getElementById(id).addEventListener('input', render));


// 啟動時自動從 Sheets 讀取
fetchFromSheets();
</script>
</body>
</html>
